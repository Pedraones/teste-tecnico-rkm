<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./home-page.css">
</head>

<body id="body">
    <form onsubmit="storePatient(event)" id="formPatient">
        <input type="hidden" value="" id="patientId">
        
        <label for="name">Nome do paciente: </label>
        <input type="text" id="name" required>
        
        <br>

        <label for="birthDate">Data de nascimento: </label>
        <input type="date" id="birthDate" required>
        
        <br>

        <label for="cpf">CPF: </label>
        <input type="integer" id="cpf" minlength="11" maxlength="11" required>
        
        <br>
        
        <label for="phone">Telefone: </label>
        <input type="text" id="phone" maxlength="15">
        
        <br>

        <label for="healthUnitId">Unidade do paciente: </label>
        <br>
        <select id="healthUnitId" required></select>
        
        <br>
        
        <button type="submit" id="buttonForm">Criar</button>
    </form>
    
    <h3>Buscar por paciente</h3>
    <input type="text" placeholder="Digite o nome do paciente" id="inputSearchPatient">
    <br>
    <button type="button" id="buttonSearchPatient">Buscar</button>
    <button type="button" id="buttonCleanSearchPatient" onclick="cleanSearch()">Limpar busca</button>

    <table id="listPatients">
        <tr>
            <th>Pacientes</th>
            <th>Unidade</th>
        </tr>
    </table>
</body>
    
<script type="text/javascript" src="./add-patients.js"></script>
<script type="text/javascript" src="./show-list-patients.js"></script>
<script type="text/javascript" src="./search-patients.js"></script>
</html>
